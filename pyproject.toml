[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pywebchannel"
version = "0.2"
description = "An implementation of Qt's WebChannel protocol in pure Python"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only OR GPL-2.0-or-later"
license-files = ["LICENSE.LGPL3", "LICENSE.GPL2"]
authors = [
    { name = "Arno Rehn", email = "a.rehn@menlosystems.com" },
    { name = "Milian Wolff" },
]
maintainers = [{ name = "Arno Rehn", email = "a.rehn@menlosystems.com" }]
keywords = ["qt", "webchannel", "qwebchannel", "rpc", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
examples = ["websockets>=14", "aioconsole>=0.8"]

[project.urls]
Homepage = "https://github.com/MenloSystems/pywebchannel"
Source = "https://github.com/MenloSystems/pywebchannel"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pywebchannel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

